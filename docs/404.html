<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 — Neon Engine</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#08080f" />
<link rel="icon" type="image/svg+xml" href="/neon-engine/assets/favicon.svg" />
<style>
  :root{--bg:#08080f;--accent:#2dd4bf;--text:#cfe6e2;--muted:#7d9a97;
        --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);display:grid;place-items:center;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;
    overflow:hidden}
  .grid{position:fixed;inset:0;pointer-events:none;opacity:.85;
    background-image:linear-gradient(to right,rgba(45,212,191,.08) 1px,transparent 1px),
                     linear-gradient(to bottom,rgba(45,212,191,.08) 1px,transparent 1px);
    background-size:52px 52px;
    transform:perspective(420px) rotateX(62deg);transform-origin:50% 100%;
    -webkit-mask-image:linear-gradient(to top,#000,rgba(0,0,0,.3) 45%,transparent 80%);
            mask-image:linear-gradient(to top,#000,rgba(0,0,0,.3) 45%,transparent 80%)}
  main{position:relative;z-index:1;max-width:560px}
  .code{font-family:var(--mono);font-size:13px;color:var(--accent);letter-spacing:.16em;text-transform:uppercase}
  h1{font-size:clamp(52px,16vw,104px);margin:6px 0 0;color:#eafaf7;line-height:1;font-weight:800}
  p{color:var(--muted);margin:16px 0 0}
  a.btn{display:inline-flex;align-items:center;gap:9px;margin-top:26px;font-family:var(--mono);
    font-size:14px;padding:12px 19px;border-radius:9px;border:1px solid rgba(45,212,191,.4);
    color:var(--accent);background:rgba(45,212,191,.08);text-decoration:none}
  a.btn:hover{background:rgba(45,212,191,.14)}
</style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>
  <main>
    <div class="code">// err_no_route</div>
    <h1>404</h1>
    <p>That path is not part of the engine. Nothing here but grid lines.</p>
    <a class="btn" href="/neon-engine/">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H6M11 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to Neon Engine
    </a>
  </main>
</body>
</html>
