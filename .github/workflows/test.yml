name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # was @v4
        with:
          node-version: '20'

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          which chromium-browser || which chromium

      - name: Install puppeteer-core
        run: npm install --no-save puppeteer-core

      - name: Syntax check every module
        run: |
          for f in *.js; do node --check "$f"; done

      # The page audit's deletions are what took this suite down once (a deleted
      # example/index.html, and two tests that booted it). This runs in a second
      # and needs no browser, so it goes first and it fails loudly.
      - name: Page-audit guard
        run: node tests/pages.cjs

      # CHROME_PATH is deliberately not set: tests/harness.cjs probes for the
      # browser, so a machine that puts it somewhere else still runs the suite
      # instead of timing out on a path that does not exist.
      - name: Headless smoke test
        run: node tests/smoke.cjs

      # The smoke test proves the engine boots; this proves the buildings it
      # generates are places a player can get into and up through.
      - name: World structure test
        run: node tests/world.cjs
