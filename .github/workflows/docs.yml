name: docs

# Exported symbols must carry a JSDoc block. Ported from drsamonline/Hellgate.
# It ran in --warn mode while the backlog was 84 of 86; that backlog is cleared,
# so the rule is enforced now.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # was @v4
        with:
          node-version: '20'
      - name: Exported symbols carry a JSDoc block
        run: node tools/check-docs.mjs --src .
